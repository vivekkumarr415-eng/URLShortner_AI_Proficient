spring:
  application:
    name: url-service
  datasource:
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          analytics-service:
            connectTimeout: 500
            readTimeout: 1000
            loggerLevel: basic

analytics-service:
  base-url: http://localhost:8082

server:
  port: 8081
  shutdown: graceful
  max-http-request-header-size: 16KB

security:
  # Set URL_SERVICE_API_KEY in every non-local environment; never commit its value.
  api-key: ${URL_SERVICE_API_KEY:}
  rate-limit:
    requests-per-minute: ${URL_SERVICE_RATE_LIMIT:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.urlshortener: INFO
