spring:
  datasource:
    # Values are injected by the deployment platform or a secrets manager.
    url: ${URL_SERVICE_DB_URL}
    username: ${URL_SERVICE_DB_USERNAME}
    password: ${URL_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

security:
  api-key: ${URL_SERVICE_API_KEY}
